<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111823"/>
    </linearGradient>

    <!-- Top Shimmer Accent -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#34d399;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#c084fc;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle Circuit/Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.35"/>
      <circle cx="28" cy="0" r="1" fill="#58a6ff" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-ring {
      0% { r: 4px; opacity: 0.9; }
      50% { r: 8px; opacity: 0.3; }
      100% { r: 11px; opacity: 0; }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulsing-ring {
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      transform-origin: center;
    }
    .cursor {
      animation: cursor-blink 1s infinite;
    }
  </style>

  <!-- Outer Card -->
  <rect width="920" height="220" rx="14" fill="url(#bg)"/>
  <rect width="920" height="220" rx="14" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="918.5" height="218.5" rx="13.25" stroke="#30363d" stroke-width="1.2"/>

  <!-- Top Animated Accent Line -->
  <path d="M 14 1.5 L 906 1.5" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Status Pill: Clean fit without Hyderabad -->
  <rect x="36" y="26" width="260" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Radar Wave -->
  <circle cx="50" cy="38" r="4" fill="#3fb950" class="pulsing-ring" />
  <circle cx="50" cy="38" r="4" fill="#3fb950"/>
  <text x="62" y="42" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">SENIOR CLOUD ENGINEER (L5) · UBER</text>

  <!-- Right Terminal Prompt Pill -->
  <rect x="702" y="26" width="182" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="716" y="42" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500">atul@phantomhive:~$<tspan class="cursor" fill="#58a6ff"> ▋</tspan></text>

  <!-- Main Headline -->
  <text x="36" y="88" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">Atul Kumar Khetan</text>
  <text x="36" y="114" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Architecting public cloud platforms (AWS · GCP · Azure), bare-metal colocation DCs, and zero-trust GitOps fleets at scale.</text>

  <!-- 4 Bento Metric Cards -->
  <!-- Bento 1: Fleet Scale -->
  <g>
    <rect x="36" y="136" width="202" height="62" rx="9" fill="#161b22" fill-opacity="0.95" stroke="#30363d" stroke-width="1"/>
    <rect x="36" y="136" width="3" height="62" rx="1.5" fill="#58a6ff"/>
    <text x="50" y="161" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" font-weight="700">2,000+ Hosts</text>
    <text x="50" y="181" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">6,000+ Devices · 3 Colo DCs</text>
  </g>

  <!-- Bento 2: High Availability -->
  <g>
    <rect x="252" y="136" width="202" height="62" rx="9" fill="#161b22" fill-opacity="0.95" stroke="#30363d" stroke-width="1"/>
    <rect x="252" y="136" width="3" height="62" rx="1.5" fill="#3fb950"/>
    <text x="266" y="161" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" font-weight="700">99.99% Uptime</text>
    <text x="266" y="181" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">100+ Multi-Region EKS Services</text>
  </g>

  <!-- Bento 3: Cloud FinOps Savings -->
  <g>
    <rect x="468" y="136" width="202" height="62" rx="9" fill="#161b22" fill-opacity="0.95" stroke="#30363d" stroke-width="1"/>
    <rect x="468" y="136" width="3" height="62" rx="1.5" fill="#bc8cff"/>
    <text x="482" y="161" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" font-weight="700">~$500K / yr</text>
    <text x="482" y="181" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">~40% Cloud FinOps Cost Cut</text>
  </g>

  <!-- Bento 4: Compliance & Observability -->
  <g>
    <rect x="684" y="136" width="200" height="62" rx="9" fill="#161b22" fill-opacity="0.95" stroke="#30363d" stroke-width="1"/>
    <rect x="684" y="136" width="3" height="62" rx="1.5" fill="#ffa657"/>
    <text x="698" y="161" fill="#ffa657" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="16.5" font-weight="700">Zero-Trust &amp; IaC</text>
    <text x="698" y="181" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">FedRAMP · PCI DSS · mTLS</text>
  </g>
</svg>
