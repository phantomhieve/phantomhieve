<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hud-bg" x1="0" y1="0" x2="920" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0e131b"/>
    </linearGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="920" y2="0" stroke="#161b22" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-green {
      0%, 100% { fill: #3fb950; opacity: 1; }
      50% { fill: #2ea043; opacity: 0.5; }
    }
    @keyframes pulse-bar {
      0%, 100% { width: 120px; }
      50% { width: 95px; }
    }
    @keyframes pulse-bar-2 {
      0%, 100% { width: 75px; }
      50% { width: 105px; }
    }
    .pulsing-green {
      animation: pulse-green 2.5s infinite;
    }
    .bar-anim-1 {
      animation: pulse-bar 4s ease-in-out infinite;
    }
    .bar-anim-2 {
      animation: pulse-bar-2 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Outer Window Frame -->
  <rect width="920" height="250" rx="12" fill="url(#hud-bg)"/>
  <rect width="920" height="250" rx="12" fill="url(#scanlines)"/>
  <rect x="0.75" y="0.75" width="918.5" height="248.5" rx="11.25" stroke="url(#hud-border)" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 908 0 C 914.627 0 920 5.373 920 12 L 920 36 L 0 36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="920" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="20" cy="18" r="5" fill="#f85149"/>
  <circle cx="36" cy="18" r="5" fill="#e3b341"/>
  <circle cx="52" cy="18" r="5" fill="#3fb950"/>

  <!-- Window Title -->
  <text x="76" y="22" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500">
    phantomhive-node-01.lan · Prometheus Node Exporter Telemetry · <tspan fill="#58a6ff">SYS_STAT: HEALTHY</tspan>
  </text>

  <!-- Live Pill on Right -->
  <rect x="760" y="8" width="144" height="20" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="774" cy="18" r="3.5" fill="#3fb950" class="pulsing-green"/>
  <text x="784" y="22" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600">UPTIME: 99.999%</text>

  <!-- Content 3-Column Bento Layout -->

  <!-- Column 1: Node & Hardware Specs (x: 24 to 300) -->
  <g transform="translate(24, 48)">
    <text x="0" y="16" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700">⚙️ HOST &amp; KERNEL</text>
    
    <text x="0" y="38" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <tspan fill="#f0f6fc">Host:</tspan> phantomhive-node-01
    </text>
    <text x="0" y="56" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <tspan fill="#f0f6fc">OS:</tspan> Ubuntu 24.04 LTS (x86_64)
    </text>
    <text x="0" y="74" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <tspan fill="#f0f6fc">Kernel:</tspan> Linux 6.8.0-cloud-hardened
    </text>
    <text x="0" y="92" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <tspan fill="#f0f6fc">Storage:</tspan> 64GB RAM · NVMe ZFS Mirror
    </text>
    <text x="0" y="110" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <tspan fill="#f0f6fc">Network:</tspan> 2.5GbE · WireGuard Mesh
    </text>
    <text x="0" y="128" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">
      <tspan fill="#f0f6fc">Zero-Trust:</tspan> Cloudflare Zero Trust
    </text>

    <!-- Mini Gauge -->
    <text x="0" y="152" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10">CPU LOAD</text>
    <rect x="62" y="144" width="180" height="8" rx="4" fill="#21262d"/>
    <rect x="62" y="144" width="75" height="8" rx="4" fill="#58a6ff" class="bar-anim-1"/>

    <text x="0" y="170" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10">RAM POOL</text>
    <rect x="62" y="162" width="180" height="8" rx="4" fill="#21262d"/>
    <rect x="62" y="162" width="110" height="8" rx="4" fill="#3fb950" class="bar-anim-2"/>
  </g>

  <!-- Divider Line 1 -->
  <line x1="310" y1="46" x2="310" y2="238" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Column 2: Systemd Daemons & Workloads (x: 324 to 606) -->
  <g transform="translate(324, 48)">
    <text x="0" y="16" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700">🚀 ACTIVE SYSTEMD SERVICES</text>

    <!-- Service 1 -->
    <rect x="0" y="26" width="280" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <circle cx="12" cy="39" r="3.5" fill="#3fb950"/>
    <text x="22" y="42" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">vault.service</text>
    <rect x="226" y="31" width="46" height="17" rx="4" fill="#238636" fill-opacity="0.25"/>
    <text x="232" y="43" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700">ACTIVE</text>
    <text x="22" y="56" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.2">Personal Finance &amp; ASGI MCP Hub</text>

    <!-- Service 2 -->
    <rect x="0" y="68" width="280" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <circle cx="12" cy="81" r="3.5" fill="#3fb950"/>
    <text x="22" y="84" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">kites-sync.service</text>
    <rect x="226" y="73" width="46" height="17" rx="4" fill="#238636" fill-opacity="0.25"/>
    <text x="232" y="85" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700">ACTIVE</text>
    <text x="22" y="98" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.2">Zerodha Auto-Sync · Headless TOTP</text>

    <!-- Service 3 -->
    <rect x="0" y="110" width="280" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <circle cx="12" cy="123" r="3.5" fill="#3fb950"/>
    <text x="22" y="126" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">cashcenter.service</text>
    <rect x="226" y="115" width="46" height="17" rx="4" fill="#238636" fill-opacity="0.25"/>
    <text x="232" y="127" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700">ACTIVE</text>
    <text x="22" y="140" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.2">Wholesale Ledger · Gemini AI DAG</text>

    <!-- Service 4 -->
    <rect x="0" y="152" width="280" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <circle cx="12" cy="165" r="3.5" fill="#3fb950"/>
    <text x="22" y="168" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600">node_exporter.service</text>
    <rect x="226" y="157" width="46" height="17" rx="4" fill="#238636" fill-opacity="0.25"/>
    <text x="232" y="169" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700">ACTIVE</text>
    <text x="22" y="182" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.2">Host Telemetry · Prom Port 9100</text>
  </g>

  <!-- Divider Line 2 -->
  <line x1="620" y1="46" x2="620" y2="238" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Column 3: SRE Architecture & Mission Profile (x: 636 to 896) -->
  <g transform="translate(636, 48)">
    <text x="0" y="16" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700">🎯 ARCHITECTURE &amp; OBSERVABILITY</text>

    <!-- Bento Highlight Box 1 -->
    <rect x="0" y="26" width="260" height="68" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="47" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700">Observability Core</text>
    <text x="12" y="65" fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5">
      Pull-based telemetry, SLI/SLO burn alerts,
    </text>
    <text x="12" y="81" fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5">
      federated M3 metrics, and zero alert fatigue.
    </text>

    <!-- Bento Highlight Box 2: CI/CD & Deployment Fabric -->
    <rect x="0" y="104" width="260" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <rect x="0" y="104" width="3" height="84" rx="1.5" fill="#58a6ff"/>
    <text x="12" y="123" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700">CI/CD &amp; Deployment Fabric</text>
    <text x="12" y="141" fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5">
      GitHub Actions automated SSH/rsync,
    </text>
    <text x="12" y="157" fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5">
      zero-downtime systemd unit reloads, and
    </text>
    <text x="12" y="173" fill="#b1bac4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5">
      custom textfile Prometheus metrics.
    </text>
  </g>
</svg>
